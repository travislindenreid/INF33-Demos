<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-button expand="full" color="primary" (click)="presentToast()">Send Toast</ion-button>
  <ion-button expand="full" color="primary" (click)="presentAlert()">Send Alert</ion-button>
  <ion-button expand="full" color="primary" (click)="presentActionSheet()">Send Action Sheet</ion-button>
  <ion-button expand="full" color="primary" (click)="presentModal()">Show Modal Example</ion-button>
</ion-content>
